<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Duck Native" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F27"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#F4B223"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#F26A1B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0A0C10"/>

  <!-- Mark, scaled from the 512 icon -->
  <g transform="translate(70 40) scale(0.625) translate(-32 -32)">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#tile)"/>
    <rect x="33" y="33" width="446" height="446" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <g transform="translate(-22 4)">
      <rect x="300" y="214" width="140" height="64" rx="32" fill="url(#beak)"/>
    <circle cx="240" cy="236" r="118" fill="url(#head)"/>
      
      <circle cx="284" cy="212" r="14" fill="#0A0C10"/>
      <circle cx="289" cy="207" r="4.5" fill="#FFFFFF"/>
    </g>
    <rect x="206" y="420" width="100" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="218" font-family="'Inter','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="128" letter-spacing="-3" fill="#F5F6F8">
    <tspan font-weight="700">duck</tspan><tspan font-weight="300" fill="#F4B223" dx="18">native</tspan>
  </text>
</svg>
